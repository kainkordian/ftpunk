name: Web app on GitHub Pages
# Publishes ftpunk_web/ (built with tools/build.py) to https://kainkordian.github.io/ftpunk/.
# Needs Settings → Pages → Source: "GitHub Actions". The earlier web app stays at tag web-v1.
on:
  push:
    branches: [main]
    paths: ['ftpunk_web/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test in headless Chrome (a failing suite never deploys)
        run: python3 ftpunk_web/tools/test.py
      - name: Build the static site
        run: python3 ftpunk_web/tools/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ftpunk_web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
