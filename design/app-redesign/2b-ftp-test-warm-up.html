<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FTPunk mockup · FTP test cockpit, warm-up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tektur:wdth,wght@75..100,400..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0d0c15}
.tile{background:#191827;border-radius:32px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.lab{font:800 30px/1 Tektur,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#a9a9bf;display:flex;align-items:center;gap:12px}
.num{font-family:Tektur,sans-serif;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:.8;font-variation-settings:"wdth" 85}
.unit{font:800 44px/1 Tektur,sans-serif;color:#a9a9bf;margin-left:12px}
.pick{all:unset;cursor:pointer;box-sizing:border-box;display:flex;align-items:center;gap:12px;height:56px;padding:0 20px 0 18px;border-radius:28px;background:#232235;font:800 30px/1 Tektur,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#a9a9bf}
.btn{all:unset;cursor:pointer;box-sizing:border-box;display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 20px;border-radius:22px;font:800 17px Tektur,sans-serif;background:#232235;color:#f3f4f8}
.seg{flex:1;height:16px;border-radius:8px;background:#2b2a40}
</style>
</head>
<body>
<div style="width:1470px;height:920px;box-sizing:border-box;padding:20px 24px 24px;display:flex;flex-direction:column;gap:16px;background:#0d0c15;color:#f3f4f8;font-family:Tektur,sans-serif;overflow:hidden">
  <header style="height:60px;flex-shrink:0;display:flex;align-items:center;gap:16px">
    <button type="button" class="btn" aria-label="Minimise ride" style="width:44px;padding:0;justify-content:center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7l6 6 6-6"></path></svg></button>
    <span style="display:inline-flex;align-items:center;height:30px;padding:0 14px;border-radius:15px;background:#c5f74d;color:#10110a;font:900 15px Tektur;letter-spacing:.08em">FTP TEST</span>
    <span style="font:800 24px Tektur">Warm-up · then ramp 25 W / min</span>
    <span style="flex-grow:1"></span>
    <span style="display:flex;align-items:center;gap:14px;font:700 16px Tektur;color:#a9a9bf"><span style="display:flex;align-items:center;gap:6px"><i style="width:10px;height:10px;border-radius:5px;background:#c5f74d"></i>Trainer</span><span style="display:flex;align-items:center;gap:6px"><i style="width:10px;height:10px;border-radius:5px;background:#c5f74d"></i>Power</span><span style="display:flex;align-items:center;gap:6px"><i style="width:10px;height:10px;border-radius:5px;background:#c5f74d"></i>Heart rate</span></span>
    <span style="font:800 24px Tektur;font-variant-numeric:tabular-nums;margin:0 8px">18:42</span>
    <button type="button" class="btn">Stop &amp; save</button>
    <button type="button" class="btn" aria-label="More options" style="width:44px;padding:0;justify-content:center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><circle cx="4" cy="10" r="2"></circle><circle cx="10" cy="10" r="2"></circle><circle cx="16" cy="10" r="2"></circle></svg></button>
  </header>

  <div style="height:372px;flex-shrink:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px">
    <section class="tile" style="padding:26px 32px">
      <div style="display:flex;align-items:center;justify-content:space-between;min-height:68px">
        <button type="button" class="pick" aria-label="Power average, 3 seconds. Change"><svg aria-hidden="true" width="26" height="30" viewBox="0 0 26 30" fill="#a9a9bf"><path d="M15 0L2 17h9l-2 13 15-19h-10z"></path></svg>Power · 3 s<svg aria-hidden="true" width="16" height="16" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 4l4 4 4-4"></path></svg></button>
        
      </div>
      <p style="margin:0;display:flex;align-items:baseline;justify-content:center"><span class="num" style="font-size:220px">123</span><span class="unit" style="font-size:56px">W</span></p>
      <div style="display:flex;align-items:baseline;justify-content:center;gap:16px"><span class="lab">Target</span><span class="num" style="font-size:76px;color:#c5f74d">125</span><span class="unit" style="font-size:34px;margin-left:0">W</span></div>
    </section>
    <section class="tile" style="padding:26px 32px">
      <div style="display:flex;align-items:center;justify-content:space-between;min-height:68px">
        <span class="lab"><svg aria-hidden="true" width="28" height="30" viewBox="0 0 28 30" fill="none" stroke="#a9a9bf" stroke-width="3" stroke-linecap="round"><circle cx="14" cy="17" r="11"></circle><path d="M14 17V10M10 2h8"></path></svg>Ramp starts in</span>
      </div>
      <p style="margin:0;text-align:center"><span class="num" style="font-size:220px">4:12</span></p>
      <div style="display:flex;flex-direction:column;gap:14px">
        <span style="font:800 40px/1 Tektur">Warm-up · spin easy</span>
        <div style="height:16px;border-radius:8px;background:#2b2a40;overflow:hidden" aria-hidden="true"><i style="display:block;width:58%;height:100%;border-radius:8px;background:#7d8191"></i></div>
      </div>
    </section>
  </div>

  <div style="height:252px;flex-shrink:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px">
    <section style="background:#191827;border-radius:32px;box-sizing:border-box;display:flex;flex-direction:column;min-width:0;padding:22px 28px">
      <span style="display:flex;align-items:center;justify-content:space-between;min-height:32px"><span class="lab" style="color:#ff7ab8"><svg aria-hidden="true" width="30" height="28" viewBox="0 0 30 28" fill="#ff7ab8"><path d="M15 27C4 19 0 13 0 8a8 8 0 0115-4 8 8 0 0115 4c0 5-4 11-15 19z"></path></svg>Heart rate</span></span>
      <span style="flex-grow:1;display:flex;align-items:center;justify-content:center"><span style="display:flex;align-items:baseline"><span class="num" style="font-size:185px;color:#ff7ab8">112</span><span class="unit" style="font-size:38px">bpm</span></span></span>
    </section>
    <section style="background:#191827;border-radius:32px;box-sizing:border-box;display:flex;flex-direction:column;min-width:0;padding:22px 28px">
      <span style="display:flex;align-items:center;justify-content:space-between;min-height:32px"><span class="lab" style="color:#a9a9bf"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#a9a9bf" stroke-width="3" stroke-linecap="round"><circle cx="15" cy="15" r="12"></circle><path d="M15 15l7-7"></path><circle cx="15" cy="15" r="2" fill="#a9a9bf"></circle></svg>Cadence</span></span>
      <span style="flex-grow:1;display:flex;align-items:center;justify-content:center"><span style="display:flex;align-items:baseline"><span class="num" style="font-size:185px;color:#f3f4f8">88</span><span class="unit" style="font-size:38px">rpm</span></span></span>
    </section>
    <section style="background:#152430;border-radius:32px;box-sizing:border-box;display:flex;flex-direction:column;min-width:0;padding:22px 28px">
      <span style="display:flex;align-items:center;justify-content:space-between;min-height:32px"><span class="lab" style="color:#5fd9e8"><svg aria-hidden="true" width="30" height="26" viewBox="0 0 30 26" fill="#5fd9e8"><path d="M0 2l13 11L0 24zM15 2l13 11-13 11z"></path></svg>First step</span><span style="font:800 30px/1 Tektur,sans-serif;color:#a9a9bf">+5 W / 12 s</span></span>
      <span style="flex-grow:1;display:flex;align-items:center;justify-content:center"><span style="display:flex;align-items:baseline"><span class="num" style="font-size:185px;color:#5fd9e8">100</span><span class="unit" style="font-size:38px">W</span></span></span>
    </section>
  </div>

  <section aria-label="Test phases" style="flex-grow:1;min-height:0;background:#191827;border-radius:28px;padding:16px 24px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between">
    <div style="display:flex;gap:6px;font:800 24px/1 Tektur,sans-serif;color:#a9a9bf"><span style="flex:10;color:#f3f4f8">Warm-up · 10:00</span><span style="flex:16">Ramp · until you stop</span><span style="flex:3;display:flex;justify-content:flex-end;white-space:nowrap">Cool-down · 3:00</span></div>
    <div style="display:flex;gap:6px;height:44px" aria-hidden="true">
      <span style="flex:10;border-radius:12px;background:#2b2a40;overflow:hidden"><i style="display:block;width:58%;height:100%;background:#7d8191"></i></span>
      <span style="flex:16;border-radius:12px;background:linear-gradient(90deg,#3d4a1c,#c5f74d);opacity:.55"></span>
      <span style="flex:3;border-radius:12px;background:#2b2a40"></span>
    </div>
  </section>
</div>
</body>
</html>
