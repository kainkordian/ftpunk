<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FTPunk Web · Tests</title><style>body{font:14px/1.7 system-ui;margin:40px;max-width:1000px;background:#f6f7f2;color:#1c281f}li{padding:5px}.fail{color:#a12c35}pre{white-space:pre-wrap}h1{letter-spacing:-.05em}</style><h1>FTPunk Web · Verification</h1><p id="summary">Running…</p><ol id="results"></ol><script type="module">
// Run by `python3 tools/test.py` (headless Chrome) or by opening /tests/ in any browser through tools/serve.py.
// The final result is POSTed to /__test-result, which only `serve.py --test` accepts.
const failures = [], notes = [];
const row = (text, ok) => { const li = document.createElement('li'); li.className = ok ? 'pass' : 'fail'; li.textContent = text; document.querySelector('#results').append(li); };
async function report(passed, failed) {
  document.querySelector('#summary').textContent = `${passed} passed; ${failed} failed.`;
  document.title = `${failed ? 'FAIL' : 'PASS'} · FTPunk Web tests`;
  try { await fetch('/__test-result', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ passed, failed, failures, notes }) }); } catch { /* opened by hand */ }
}
try {
  // Importing every module catches syntax errors in modules no suite touches.
  const listing = await (await fetch('/__modules')).json().catch(() => ({ modules: [], tests: [] })), modules = listing.modules;
  for (const name of modules) if (name !== 'src/app.mjs') { try { await import('../' + name); } catch (error) { failures.push(`import ${name}: ${error.message}`); row(`FAIL import ${name}: ${error.message}`, false); } }
  const { runSuite } = await import('./harness.mjs');
  await import('./suite.mjs');
  // Every tests/*.test.mjs registers its tests with harness.mjs when imported; later plans add their own file and edit nothing here.
  for (const name of listing.tests) { try { await import('../' + name); } catch (error) { failures.push(`import ${name}: ${error.message}`); row(`FAIL import ${name}: ${error.message}`, false); } }
  const { runStorageSuite } = await import('./storage-suite.mjs');
  const result = await runSuite(r => { row(`${r.ok ? 'PASS' : 'FAIL'} ${r.name}${r.ok ? '' : '\n' + r.error}`, r.ok); if (!r.ok) failures.push(`${r.name}\n${r.error}`); });
  try { const description = await runStorageSuite(); row('PASS Real ' + description, true); result.passed++; notes.push('IndexedDB suite passed.'); }
  catch (error) { row('FAIL IndexedDB: ' + error.message, false); failures.push('IndexedDB: ' + (error.stack ?? error.message)); result.failed++; }
  await report(result.passed, result.failed + failures.filter(f => f.startsWith('import ')).length);
} catch (error) {
  failures.push('Test page crashed: ' + (error.stack ?? error.message)); row('FAIL ' + error.message, false);
  await report(0, 1);
}
</script></html>
